[project]
name = "comfyui-run-once-group"
description = "Switch chosen groups to Bypass, Mute or Active for one queue submit, then put every node back to the mode it actually had."
version = "1.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.9"
# Deliberately empty. The node holds settings and the work happens in the frontend, so there is
# nothing to install and nothing to conflict with whatever else is in the user's environment.
dependencies = []

[project.urls]
Repository = "https://github.com/ssain3d-lgtm/comfyui-run-once-group"

[tool.comfy]
# From registry.comfy.org after signing in and creating a publisher. Publishing fails while this
# is blank; everything else here is already correct.
PublisherId = ""
DisplayName = "Run Once Group Toggle"
Icon = ""
